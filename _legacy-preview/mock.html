<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mẫu bố cục trang trại EquiFlow phiên bản 3" />
    <title>EquiFlow — Mẫu bố cục trang trại</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="viewport">
      <h1 class="srOnly">Mẫu bố cục trang trại EquiFlow</h1>
      <section class="farm" aria-label="Bản đồ trang trại nhìn từ trên xuống">
        <div class="river" aria-hidden="true"></div>
        <div class="topRoad" aria-hidden="true"></div>
        <div class="bridge" aria-hidden="true"></div>

        <aside class="landscape" aria-label="Khu cảnh quan trang trại">
          <div class="tree treeA" aria-hidden="true"><img src="/assets/tree-1.png" alt="" /></div>
          <div class="tree treeB" aria-hidden="true"><img src="/assets/tree-2.png" alt="" /></div>
          <div class="tree treeC" aria-hidden="true"><img src="/assets/tree-1.png" alt="" /></div>
          <img class="well" src="/assets/well.png" alt="" />
          <div class="pond" aria-hidden="true"><span></span></div>
          <div class="garden" aria-hidden="true">✿ ✾ ✿<br />✾ ✿ ✾</div>
          <h2 class="woodSign landscapeSign">Cảnh quan<br />nông trại</h2>
        </aside>

        <div class="buildingPath" aria-hidden="true"></div>
        <section class="buildings" aria-label="Cụm công trình chính">
          <article class="building supply">
            <div class="buildingArt"><img src="/assets/supply-barn.png" alt="" /></div>
            <h2 class="woodSign">Kho vật tư</h2>
          </article>
          <article class="building stable">
            <div class="buildingArt"><img src="/assets/stable.png" alt="" /></div>
            <h2 class="woodSign">Chuồng ngựa</h2>
          </article>
          <article class="building clinic">
            <div class="buildingArt"><img src="/assets/vet.png" alt="" /></div>
            <h2 class="woodSign">Trạm y tế</h2>
          </article>
          <article class="building staffHouse">
            <div class="buildingArt"><img src="/assets/staff-house.png" alt="" /></div>
            <h2 class="woodSign">Nhà nhân viên<br />chăm sóc</h2>
          </article>
        </section>

        <section class="training" aria-label="Khu vực huấn luyện ngựa">
          <h2 class="woodSign trainingSign">Khu vực huấn luyện ngựa</h2>
          <div class="horse horseOne" aria-label="Ngựa đang tập"></div>
          <div class="horse horseTwo" aria-label="Ngựa đang tập"></div>
          <div class="jump jumpOne" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="jump jumpTwo" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="cones" aria-hidden="true">▲&nbsp;&nbsp;&nbsp;▲&nbsp;&nbsp;&nbsp;▲</div>
        </section>

        <section class="racetrack" aria-label="Trường đua">
          <div class="trackLane trackLaneOuter" aria-hidden="true"></div>
          <div class="trackLane trackLaneInner" aria-hidden="true"></div>
          <div class="infield">
            <div class="tree infieldTreeA" aria-hidden="true"><img src="/assets/tree-1.png" alt="" /></div>
            <div class="tree infieldTreeB" aria-hidden="true"><img src="/assets/tree-2.png" alt="" /></div>
            <div class="infieldPond" aria-hidden="true"></div>
            <h2 class="woodSign trackSign"><span aria-hidden="true">♞</span> Trường đua <span aria-hidden="true">♞</span></h2>
          </div>
          <div class="finishLine" aria-hidden="true"></div>
        </section>

        <div class="foregroundTrees" aria-hidden="true">
          <div class="tree"><img src="/assets/tree-2.png" alt="" /></div>
          <div class="tree"><img src="/assets/tree-1.png" alt="" /></div>
          <div class="tree"><img src="/assets/tree-2.png" alt="" /></div>
          <div class="tree"><img src="/assets/tree-1.png" alt="" /></div>
          <div class="tree"><img src="/assets/tree-2.png" alt="" /></div>
        </div>
      </section>
    </main>
  </body>
</html>
