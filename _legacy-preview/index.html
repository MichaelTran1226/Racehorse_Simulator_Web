<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trang trại EquiFlow phiên bản 3" />
    <title>EquiFlow — Trang trại</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/src/intro.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <h1 class="srOnly">Trang trại EquiFlow</h1>
      <div class="world" id="world">
        <img class="map" src="/assets/maps/farm-ref-map.png" width="1280" height="768" alt="Bản đồ trang trại nhìn từ trên xuống" />
        <ul class="signs" id="signs" aria-label="Công trình chính"></ul>
      </div>

      <div class="clouds" id="clouds" aria-hidden="true">
        <div class="far far-left">
          <img src="/assets/clouds/mid1.png" alt="" style="--x: 8%; --y: 18%; --w: 22vmax" />
          <img src="/assets/clouds/small1.png" alt="" style="--x: 30%; --y: 62%; --w: 14vmax" />
          <img src="/assets/clouds/small2.png" alt="" style="--x: 2%; --y: 78%; --w: 20vmax" />
        </div>
        <div class="far far-right">
          <img src="/assets/clouds/mid2.png" alt="" style="--x: 58%; --y: 12%; --w: 26vmax" />
          <img src="/assets/clouds/small3.png" alt="" style="--x: 70%; --y: 55%; --w: 12vmax" />
          <img src="/assets/clouds/mid1.png" alt="" style="--x: 52%; --y: 74%; --w: 20vmax" />
        </div>
        <div class="near near-left">
          <img src="/assets/clouds/big.png" alt="" style="--y: -14%" />
          <img src="/assets/clouds/big.png" alt="" style="--y: 30%" />
          <img src="/assets/clouds/big.png" alt="" style="--y: 74%" />
        </div>
        <div class="near near-right">
          <img src="/assets/clouds/big.png" alt="" style="--y: -4%" />
          <img src="/assets/clouds/big.png" alt="" style="--y: 40%" />
          <img src="/assets/clouds/big.png" alt="" style="--y: 84%" />
        </div>
      </div>

      <p class="skipHint" id="skipHint">Chạm hoặc nhấn phím bất kỳ để bỏ qua</p>
    </main>
    <script type="module" src="/src/intro.js"></script>
  </body>
</html>
